name: "ci"

on:
  push:
    branches: [ "*" ]
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ "*" ]
  workflow_call:

permissions:
  contents: read

env:
  TAG_PREFIX: "v"
  GO_VERSION: &go-version "1.18.x"

jobs:
  BuildAndTest:
    name: Build and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ *go-version, "oldstable", "stable" ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Test with coverage (module_test)
        run: |
          cd module_test \
          && go test -covermode=atomic -coverprofile=../coverage_module_test.out -coverpkg=github.com/btnguyen2k/cf-base ./... \
          && cd ..
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out, ./coverage_module_test.out
          flags: go-${{ matrix.go-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  GoModTidy:
    name: Check go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check module files
        working-directory: .
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  LintAndFormat:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint
        run: go vet ./...
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

  ReleaseDryRun:
    if: github.event_name == 'push'
    needs: [ BuildAndTest ]
    runs-on: ubuntu-latest
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Release (dry-run)
        id: release_dry_run
        uses: btnguyen2k/action-semrelease@v4
        with:
          dry-run: true
          auto-mode: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-major-release: false
          tag-minor-release: false
          branches: ${{ github.ref_name }}
          tag-prefix: ${{ env.TAG_PREFIX }}
          tag-only: true
